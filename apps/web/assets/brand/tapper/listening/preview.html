ening-avatar-black.svg" alt="black"><div class="cap">black</div></div><div class="card dark"><img class="art" src="svg/avatar/tapper-listening-avatar-white.svg" alt="white"><div class="cap">white</div></div><div class="card "><img class="art" src="svg/avatar/tapper-listening-avatar-orange.svg" alt="orange"><div class="cap">orange</div></div></div><h2>与现有字标组合</h2><div class="card"><img class="lockup" src="svg/lockup/tapper-listening-lockup-color.svg" alt="Tapper Listening 字标组合"></div><h2>头像实际尺寸</h2><div class="card sizes"><div class="sample"><img src="png/avatar/tapper-listening-avatar-color-24.png" width="24" height="24" alt="头像24px"><span>24px</span></div><div class="sample"><img src="png/avatar/tapper-listening-avatar-color-32.png" width="32" height="32" alt="头像32px"><span>32px</span></div><div class="sample"><img src="png/avatar/tapper-listening-avatar-color-48.png" width="48" height="48" alt="头像48px"><span>48px</span></div><div class="sample"><img src="png/avatar/tapper-listening-avatar-color-64.png" width="64" height="64" alt="头像64px"><span>64px</span></div><div class="sample"><img src="png/avatar/tapper-listening-avatar-color-128.png" width="128" height="128" alt="头像128px"><span>128px</span></div></div><h2>圆形入口实际尺寸</h2><div class="card sizes"><div class="sample"><img src="png/launcher/tapper-listening-launcher-light-32.png" width="32" height="32" alt="入口32px"><span>32px</span></div><div class="sample"><img src="png/launcher/tapper-listening-launcher-light-40.png" width="40" height="40" alt="入口40px"><span>40px</span></div><div class="sample"><img src="png/launcher/tapper-listening-launcher-light-48.png" width="48" height="48" alt="入口48px"><span>48px</span></div><div class="sample"><img src="png/launcher/tapper-listening-launcher-light-56.png" width="56" height="56" alt="入口56px"><span>56px</span></div><div class="sample"><img src="png/launcher/tapper-listening-launcher-light-64.png" width="64" height="64" alt="入口64px"><span>64px</span></div></div><p class="muted
