[project]
name = "tap-platform-backend"
version = "0.1.0"
description = "TAP non-AI backend application"
requires-python = "==3.13.12"
dependencies = ["fastapi==0.116.1", "uvicorn==0.52.4"]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==8.4.1", "pytest-asyncio==1.1.0"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tap_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
