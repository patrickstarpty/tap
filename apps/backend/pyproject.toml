[project]
name = "tap-backend"
version = "0.1.0"
description = "TAP Phase 1 backend contracts"
requires-python = "==3.13.12"
dependencies = [
  "alembic==1.16.5",
  "asyncmy==0.2.10",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "pymysql==1.1.2",
  "pydantic==2.11.7",
  "redis==6.4.0",
  "sqlalchemy[asyncio]==2.0.43",
  "pymilvus==2.6.17",
  "cryptography==50.0.0",
]

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.10",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tap"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/tap", "../../scripts/export_contracts.py"]
