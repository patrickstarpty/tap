[project]
name = "tap-backend"
version = "0.1.0"
description = "TAP Phase 1 backend contracts"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.116.1",
  "pydantic==2.11.7",
]

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "ruff==0.12.10",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tap"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/tap", "../../scripts/export_contracts.py"]
