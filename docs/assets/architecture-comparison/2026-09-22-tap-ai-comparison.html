els"><section class="panel" data-panel="cocoon"><div class="caption"><strong>A · Cocoon</strong><div class="links"><a href="2026-09-22-tap-ai-cocoon.html">HTML / 导出</a><a href="2026-09-22-tap-ai-cocoon.png">原图</a><a href="https://github.com/Cocoon-AI/architecture-diagram-generator">项目来源</a></div></div><img src="2026-09-22-tap-ai-cocoon.png" alt="Cocoon 深色技术架构图"></section><section class="panel" data-panel="excalidraw"><div class="caption"><strong>B · Excalidraw</strong><div class="links"><a href="2026-09-22-tap-ai-excalidraw.excalidraw" download>可编辑源文件</a><a href="2026-09-22-tap-ai-excalidraw.svg">矢量图</a><a href="https://github.com/github/awesome-copilot/tree/main/skills/excalidraw-diagram-generator">项目来源</a></div></div><img src="2026-09-22-tap-ai-excalidraw.png" alt="Excalidraw 浅色手绘技术架构图"></section></div><p class="note">设计范围：RFC-011 目标架构，包含未实现能力。Excalidraw 源文件可在 Excalidraw 中通过“打开”导入编辑。</p></main><script>document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{const mode=button.dataset.mode;document.body.classList.toggle('single',mode!=='both');document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelectorAll('[data-panel]').forEach(p=>p.hidden=mode!=='both'&&p.dataset.panel!==mode)}))</script></body></html>
