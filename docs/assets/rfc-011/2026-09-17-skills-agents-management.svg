<text x="1522.0" y="324.0" fill="#a7b7ca" font-size="15" font-weight="400" text-anchor="middle">后续更新</text>
<g data-node="0-main">
<rect x="64.0" y="248" width="406.0" height="202" rx="6" fill="#0b2535" stroke="#22d3ee" stroke-width="1.4"/>
<text x="86.0" y="287" fill="#f1f5f9" font-size="25" font-weight="600" text-anchor="start">保留完整资源包</text>
<text x="86.0" y="329" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">从文件、ZIP、Git 或市场导入</text>
<text x="86.0" y="357" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">保留脚本、模板、配置及依赖</text>
</g>
<g data-node="0-detail">
<rect x="64.0" y="540" width="406.0" height="192" rx="6" fill="#101d2e" stroke="#35465d" stroke-width="1"/>
<text x="86.0" y="579" fill="#f1f5f9" font-size="23" font-weight="600" text-anchor="start">形成兼容报告</text>
<text x="86.0" y="621" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">分别标记可用、待配置、不支持</text>
<text x="86.0" y="649" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">依赖缺失阻止受影响资源启用</text>
<text x="86.0" y="710" fill="#22d3ee" font-size="16" font-weight="400" text-anchor="start">导入不执行脚本或 Hooks</text>
</g>
<text x="64.0" y="511" fill="#758ba3" font-size="16" font-weight="400" text-anchor="start">输出与控制</text>
<g data-node="1-main">
<rect x="566.0" y="248" width="406.0" height="202" rx="6" fill="#211e39" stroke="#a78bfa" stroke-width="1.4"/>
<text x="588.0" y="287" fill="#f1f5f9" font-size="25" font-weight="600" text-anchor="start">编辑文件与配置</text>
<text x="588.0" y="329" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">文件树中编辑指令、脚本和模板</text>
<text x="588.0" y="357" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">保存后端草稿并真实试运行</text>
<text x="588.0" y="428" fill="#a78bfa" font-size="16" font-weight="400" text-anchor="start">MDXEditor / Monaco</text>
</g>
<g data-node="1-detail">
<rect x="566.0" y="540" width="406.0" height="192" rx="6" fill="#101d2e" stroke="#35465d" stroke-width="1"/>
<text x="588.0" y="579" fill="#f1f5f9" font-size="23" font-weight="600" text-anchor="start">保留内容与差异</text>
<text x="588.0" y="621" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">未知字段和未改文件原样保留</text>
<text x="588.0" y="649" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">内容或配置变化后重新验证</text>
<text x="588.0" y="710" fill="#a78bfa" font-size="16" font-weight="400" text-anchor="start">预览不执行 MDX 或脚本</text>
</g>
<text x="566.0" y="511" fill="#758ba3" font-size="16" font-weight="400" text-anchor="start">输出与控制</text>
<g data-node="2-main">
<rect x="1068.0" y="248" width="406.0" height="202" rx="6" fill="#0d2c29" stroke="#34d399" stroke-width="1.4"/>
<text x="1090.0" y="287" fill="#f1f5f9" font-size="25" font-weight="600" text-anchor="start">发布不可变版本</text>
<text x="1090.0" y="329" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">校验依赖及发布权限后启用</text>
<text x="1090.0" y="357" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">任务固定包、Agent 与 Skill 版本</text>
</g>
<g data-node="2-detail">
<rect x="1068.0" y="540" width="406.0" height="192" rx="6" fill="#101d2e" stroke="#35465d" stroke-width="1"/>
<text x="1090.0" y="579" fill="#f1f5f9" font-size="23" font-weight="600" text-anchor="start">按范围隔离执行</text>
<text x="1090.0" y="621" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">只读挂载资源，限工具与网络</text>
<text x="1090.0" y="649" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">固定依赖并限制时间和资源</text>
<text x="1090.0" y="710" fill="#34d399" font-size="16" font-weight="400" text-anchor="start">安全撤回阻止继续执行</text>
</g>
<text x="1068.0" y="511" fill="#758ba3" font-size="16" font-weight="400" text-anchor="start">输出与控制</text>
<g data-node="3-main">
<rect x="1570.0" y="248" width="406.0" height="202" rx="6" fill="#302719" stroke="#fbbf24" stroke-width="1.4"/>
<text x="1592.0" y="287" fill="#f1f5f9" font-size="25" font-weight="600" text-anchor="start">检查更新候选</text>
<text x="1592.0" y="329" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">比较来源提交、依赖及权限差异</text>
<text x="1592.0" y="357" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">验证后由有权限的人切换</text>
</g>
<g data-node="3-detail">
<rect x="1570.0" y="540" width="406.0" height="192" rx="6" fill="#101d2e" stroke="#35465d" stroke-width="1"/>
<text x="1592.0" y="579" fill="#f1f5f9" font-size="23" font-weight="600" text-anchor="start">保留旧版与定制</text>
<text x="1592.0" y="621" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">失败继续旧版，可回滚已发布版</text>
<text x="1592.0" y="649" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">定制建副本，上游不覆盖修改</text>
<text x="1592.0" y="710" fill="#fbbf24" font-size="16" font-weight="400" text-anchor="start">运行中版本不随更新漂移</text>
</g>
<text x="1570.0" y="511" fill="#758ba3" font-size="16" font-weight="400" text-anchor="start">输出与控制</text>
<rect x="40.0" y="812" width="4" height="66" rx="2" fill="#39536b" stroke="none" stroke-width="1"/>
<text x="60.0" y="837" fill="#a6b5c9" font-size="18" font-weight="400" text-anchor="start">当前仅有简化编辑与只读版本接口，完整包管理仍为目标。</text>
<rect x="693.3333333333334" y="812" width="4" height="66" rx="2" fill="#39536b" stroke="none" stroke-width="1"/>
<text x="713.3333333333334" y="837" fill="#a6b5c9" font-size="18" font-weight="400" text-anchor="start">包声明不能扩大项目权限；新增权限须重新确认。</text>
<rect x="1346.6666666666667" y="812" width="4" height="66" rx="2" fill="#39536b" stroke="none" stroke-width="1"/>
<text x="1366.6666666666667" y="837" fill="#a6b5c9" font-size="18" font-weight="400" text-anchor="start">Hooks 与插件自带 MCP 首批只保留并报告未适配。</text>
<text x="40" y="919" fill="#72869d" font-size="16" font-weight="400" text-anchor="start">TAP / TAP AI  ·  RFC-011  ·  目标设计，包含待建设能力</text>
