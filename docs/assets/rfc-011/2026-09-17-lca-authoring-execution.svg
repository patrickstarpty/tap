<text x="588.0" y="287" fill="#f1f5f9" font-size="25" font-weight="600" text-anchor="start">形成统一操作步骤</text>
<text x="588.0" y="329" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">录制、表单编辑或 AI 生成</text>
<text x="588.0" y="357" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">写清目标、输入与业务断言</text>
<text x="588.0" y="428" fill="#a78bfa" font-size="16" font-weight="400" text-anchor="start">自动化步骤定义 Test IR</text>
</g>
<g data-node="1-detail">
<rect x="566.0" y="540" width="406.0" height="192" rx="6" fill="#101d2e" stroke="#35465d" stroke-width="1"/>
<text x="588.0" y="579" fill="#f1f5f9" font-size="23" font-weight="600" text-anchor="start">保存可审阅草稿</text>
<text x="588.0" y="621" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">缺规则明确列出待补事项</text>
<text x="588.0" y="649" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">定位歧义由用户确认</text>
<text x="588.0" y="710" fill="#a78bfa" font-size="16" font-weight="400" text-anchor="start">AI 不自行补业务预期</text>
</g>
<text x="566.0" y="511" fill="#758ba3" font-size="16" font-weight="400" text-anchor="start">输出与控制</text>
<g data-node="2-main">
<rect x="1068.0" y="248" width="406.0" height="202" rx="6" fill="#302719" stroke="#fbbf24" stroke-width="1.4"/>
<text x="1090.0" y="287" fill="#f1f5f9" font-size="25" font-weight="600" text-anchor="start">在真实应用中试跑</text>
<text x="1090.0" y="329" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">单步、断点或完整执行</text>
<text x="1090.0" y="357" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">检查定位、变量、数据与证据</text>
</g>
<g data-node="2-detail">
<rect x="1068.0" y="540" width="406.0" height="192" rx="6" fill="#101d2e" stroke="#35465d" stroke-width="1"/>
<text x="1090.0" y="579" fill="#f1f5f9" font-size="23" font-weight="600" text-anchor="start">区分脚本与产品问题</text>
<text x="1090.0" y="621" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">脚本故障须修复后重新验证</text>
<text x="1090.0" y="649" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">产品缺陷保留失败与发布理由</text>
<text x="1090.0" y="710" fill="#fbbf24" font-size="16" font-weight="400" text-anchor="start">业务失败不自动阻止发布</text>
</g>
<text x="1068.0" y="511" fill="#758ba3" font-size="16" font-weight="400" text-anchor="start">输出与控制</text>
