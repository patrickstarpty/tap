<text x="86.0" y="329" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">选择用例、平台、版本与数据</text>
<text x="86.0" y="357" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">连接浏览器或安装 App 到设备</text>
</g>
<g data-node="0-detail">
<rect x="64.0" y="540" width="406.0" height="192" rx="6" fill="#101d2e" stroke="#35465d" stroke-width="1"/>
<text x="86.0" y="579" fill="#f1f5f9" font-size="23" font-weight="600" text-anchor="start">通过连接预检</text>
<text x="86.0" y="621" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">核对环境、权限及设备能力</text>
<text x="86.0" y="649" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">不可达或安装失败先处理</text>
<text x="86.0" y="710" fill="#22d3ee" font-size="16" font-weight="400" text-anchor="start">断线暂停并保留最后状态</text>
