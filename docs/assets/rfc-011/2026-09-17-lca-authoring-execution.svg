<text x="1592.0" y="357" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">正式调度 Web 或 App 执行器</text>
<text x="1592.0" y="428" fill="#34d399" font-size="16" font-weight="400" text-anchor="start">Playwright / Appium</text>
</g>
