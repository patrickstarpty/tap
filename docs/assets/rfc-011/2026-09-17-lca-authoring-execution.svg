<rect x="1570.0" y="540" width="406.0" height="192" rx="6" fill="#101d2e" stroke="#35465d" stroke-width="1"/>
<text x="1592.0" y="579" fill="#f1f5f9" font-size="23" font-weight="600" text-anchor="start">报告与维护</text>
<text x="1592.0" y="621" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">Insights 关联步骤、日志与视频</text>
<text x="1592.0" y="649" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">修复形成新版，再验证复跑</text>
<text x="1592.0" y="710" fill="#34d399" font-size="16" font-weight="400" text-anchor="start">导出前核验能力与资源</text>
</g>
<text x="1570.0" y="511" fill="#758ba3" font-size="16" font-weight="400" text-anchor="start">输出与控制</text>
<rect x="40.0" y="812" width="4" height="66" rx="2" fill="#39536b" stroke="none" stroke-width="1"/>
<text x="60.0" y="837" fill="#a6b5c9" font-size="18" font-weight="400" text-anchor="start">三个平台分别验证；一个平台通过不代表其余平台通过。</text>
<rect x="693.3333333333334" y="812" width="4" height="66" rx="2" fill="#39536b" stroke="none" stroke-width="1"/>
<text x="713.3333333333334" y="837" fill="#a6b5c9" font-size="18" font-weight="400" text-anchor="start">不能弱化业务断言掩盖失败；未到达的步骤不标通过。</text>
<rect x="1346.6666666666667" y="812" width="4" height="66" rx="2" fill="#39536b" stroke="none" stroke-width="1"/>
<text x="1366.6666666666667" y="837" fill="#a6b5c9" font-size="18" font-weight="400" text-anchor="start">交互调试直连执行服务，正式运行由 Jenkins 调度。</text>
