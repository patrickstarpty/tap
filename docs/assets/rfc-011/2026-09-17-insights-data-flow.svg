<text x="1592.0" y="287" fill="#f1f5f9" font-size="25" font-weight="600" text-anchor="start">同一 API 支撑页面与 AI</text>
<text x="1592.0" y="329" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">页面钻取失败、趋势与原始证据</text>
<text x="1592.0" y="357" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">AI 经 Insights Tool 查询并解释</text>
</g>
<g data-node="3-detail">
<rect x="1570.0" y="540" width="406.0" height="192" rx="6" fill="#101d2e" stroke="#35465d" stroke-width="1"/>
<text x="1592.0" y="579" fill="#f1f5f9" font-size="23" font-weight="600" text-anchor="start">给出可追溯判断</text>
<text x="1592.0" y="621" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">按规则判通过、不通过或数据不足</text>
<text x="1592.0" y="649" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">AI 区分事实、假设与缺失数据</text>
<text x="1592.0" y="710" fill="#fbbf24" font-size="16" font-weight="400" text-anchor="start">缺数据不默认放行</text>
</g>
<text x="1570.0" y="511" fill="#758ba3" font-size="16" font-weight="400" text-anchor="start">输出与控制</text>
<rect x="40.0" y="812" width="4" height="66" rx="2" fill="#39536b" stroke="none" stroke-width="1"/>
<text x="60.0" y="837" fill="#a6b5c9" font-size="18" font-weight="400" text-anchor="start">原型示例数据不是真实历史；ClickHouse 与完整 Insights 尚为目标</text>
<text x="60.0" y="864" fill="#a6b5c9" font-size="18" font-weight="400" text-anchor="start">。</text>
<rect x="693.3333333333334" y="812" width="4" height="66" rx="2" fill="#39536b" stroke="none" stroke-width="1"/>
<text x="713.3333333333334" y="837" fill="#a6b5c9" font-size="18" font-weight="400" text-anchor="start">Insights API 故障时明确指标不可用，不绕过接口或猜数字。</text>
<rect x="1346.6666666666667" y="812" width="4" height="66" rx="2" fill="#39536b" stroke="none" stroke-width="1"/>
<text x="1366.6666666666667" y="837" fill="#a6b5c9" font-size="18" font-weight="400" text-anchor="start">人工归因不覆盖原始失败，指标可沿查询编号追到原件。</text>
