<text x="86.0" y="287" fill="#f1f5f9" font-size="25" font-weight="600" text-anchor="start">接收真实测试与质量数据</text>
<text x="86.0" y="329" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">接入手工、自动化及负载结果</text>
<text x="86.0" y="357" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">补充缺陷、构建与代码质量</text>
</g>
<g data-node="0-detail">
<rect x="64.0" y="540" width="406.0" height="192" rx="6" fill="#101d2e" stroke="#35465d" stroke-width="1"/>
<text x="86.0" y="579" fill="#f1f5f9" font-size="23" font-weight="600" text-anchor="start">先保存原件与账本</text>
<text x="86.0" y="621" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">保留报告、日志、截图和视频</text>
<text x="86.0" y="649" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">记录来源、接收批次与校验值</text>
<text x="86.0" y="710" fill="#22d3ee" font-size="16" font-weight="400" text-anchor="start">外部报告可独立接入</text>
</g>
<text x="64.0" y="511" fill="#758ba3" font-size="16" font-weight="400" text-anchor="start">输出与控制</text>
<g data-node="1-main">
<rect x="566.0" y="248" width="406.0" height="202" rx="6" fill="#211e39" stroke="#a78bfa" stroke-width="1.4"/>
<text x="588.0" y="287" fill="#f1f5f9" font-size="25" font-weight="600" text-anchor="start">映射身份并去重</text>
<text x="588.0" y="329" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">按运行、用例、数据行与尝试映射</text>
<text x="588.0" y="357" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">校验重复、缺失和待映射记录</text>
</g>
<g data-node="1-detail">
<rect x="566.0" y="540" width="406.0" height="192" rx="6" fill="#101d2e" stroke="#35465d" stroke-width="1"/>
<text x="588.0" y="579" fill="#f1f5f9" font-size="23" font-weight="600" text-anchor="start">保留可恢复接收状态</text>
<text x="588.0" y="621" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">重复回调不重复统计</text>
<text x="588.0" y="649" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">失败补传报告，不重跑测试</text>
<text x="588.0" y="710" fill="#a78bfa" font-size="16" font-weight="400" text-anchor="start">重试与首次结果分开</text>
</g>
<text x="566.0" y="511" fill="#758ba3" font-size="16" font-weight="400" text-anchor="start">输出与控制</text>
<g data-node="2-main">
<rect x="1068.0" y="248" width="406.0" height="202" rx="6" fill="#0d2c29" stroke="#34d399" stroke-width="1.4"/>
<text x="1090.0" y="287" fill="#f1f5f9" font-size="25" font-weight="600" text-anchor="start">保存事实并计算指标</text>
<text x="1090.0" y="329" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">明细携带来源版本与更正号</text>
<text x="1090.0" y="357" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">统一分母、规则和测量窗口</text>
</g>
<g data-node="2-detail">
<rect x="1068.0" y="540" width="406.0" height="192" rx="6" fill="#101d2e" stroke="#35465d" stroke-width="1"/>
<text x="1090.0" y="579" fill="#f1f5f9" font-size="23" font-weight="600" text-anchor="start">保留查询与判定版本</text>
<text x="1090.0" y="621" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">迟到、更正触发重算</text>
<text x="1090.0" y="649" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">返回查询编号、范围与截至时间</text>
<text x="1090.0" y="710" fill="#34d399" font-size="16" font-weight="400" text-anchor="start">业务状态和审批留在 MySQL</text>
</g>
<text x="1068.0" y="511" fill="#758ba3" font-size="16" font-weight="400" text-anchor="start">输出与控制</text>
