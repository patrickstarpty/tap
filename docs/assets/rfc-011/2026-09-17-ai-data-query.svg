<rect x="1420.0" y="415.0" width="370.0" height="145.0" fill="white" stroke="#444" stroke-width="1.5"/>
<text x="1605.0" y="459.06" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">获准指标或明细快照</text>
<text x="1605.0" y="490.06" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">查询 ID、口径和数据截至时间</text>
<text x="1605.0" y="521.06" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">大规模计算留在 ClickHouse</text>
