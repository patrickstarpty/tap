<text x="1570.0" y="214" fill="#92a5bb" font-size="17" font-weight="400" text-anchor="start">Insights Tool / TAP</text>
</g>
<g data-node="0-main">
<rect x="64.0" y="248" width="406.0" height="202" rx="6" fill="#0b2535" stroke="#22d3ee" stroke-width="1.4"/>
<text x="86.0" y="287" fill="#f1f5f9" font-size="25" font-weight="600" text-anchor="start">确认问题与权限</text>
<text x="86.0" y="329" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">记录项目、来源、日期与口径</text>
<text x="86.0" y="357" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">图内选择执行方式与受控工具</text>
<text x="86.0" y="428" fill="#22d3ee" font-size="16" font-weight="400" text-anchor="start">Chat / AI Task 同一图</text>
</g>
<g data-node="0-detail">
<rect x="64.0" y="540" width="406.0" height="192" rx="6" fill="#101d2e" stroke="#35465d" stroke-width="1"/>
<text x="86.0" y="579" fill="#f1f5f9" font-size="23" font-weight="600" text-anchor="start">统一核验并回答</text>
<text x="86.0" y="621" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">后端核对数字、引用与权限</text>
<text x="86.0" y="649" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">分开呈现事实、假设和缺失</text>
<text x="86.0" y="710" fill="#22d3ee" font-size="16" font-weight="400" text-anchor="start">模型不能改写权威数字</text>
</g>
<text x="64.0" y="511" fill="#758ba3" font-size="16" font-weight="400" text-anchor="start">返回与核验</text>
<g data-node="1-main">
<rect x="566.0" y="248" width="406.0" height="202" rx="6" fill="#0d2c29" stroke="#34d399" stroke-width="1.4"/>
<text x="588.0" y="287" fill="#f1f5f9" font-size="25" font-weight="600" text-anchor="start">查条款与原文依据</text>
<text x="588.0" y="329" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">经 SearchPort 混合检索 Milvus</text>
<text x="588.0" y="357" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">按需扩展获准 MySQL 图关系</text>
<text x="588.0" y="428" fill="#34d399" font-size="16" font-weight="400" text-anchor="start">active Graph Snapshot</text>
</g>
<g data-node="1-detail">
<rect x="566.0" y="540" width="406.0" height="192" rx="6" fill="#101d2e" stroke="#35465d" stroke-width="1"/>
<text x="588.0" y="579" fill="#f1f5f9" font-size="23" font-weight="600" text-anchor="start">返回可定位证据</text>
<text x="588.0" y="621" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">保留来源版本、原文和位置</text>
<text x="588.0" y="649" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">关系扩展受深度与数量限制</text>
<text x="588.0" y="710" fill="#34d399" font-size="16" font-weight="400" text-anchor="start">支撑知识问答与 RCA</text>
</g>
<text x="566.0" y="511" fill="#758ba3" font-size="16" font-weight="400" text-anchor="start">返回与核验</text>
<g data-node="2-main">
<rect x="1068.0" y="248" width="406.0" height="202" rx="6" fill="#211e39" stroke="#a78bfa" stroke-width="1.4"/>
<text x="1090.0" y="287" fill="#f1f5f9" font-size="25" font-weight="600" text-anchor="start">完整文件计算</text>
<text x="1090.0" y="329" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">只取获准文件或缩小后的快照</text>
<text x="1090.0" y="357" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">隔离 chDB 筛选、关联与汇总</text>
<text x="1090.0" y="428" fill="#a78bfa" font-size="16" font-weight="400" text-anchor="start">明确需要时才启用</text>
</g>
<g data-node="2-detail">
<rect x="1068.0" y="540" width="406.0" height="192" rx="6" fill="#101d2e" stroke="#35465d" stroke-width="1"/>
<text x="1090.0" y="579" fill="#f1f5f9" font-size="23" font-weight="600" text-anchor="start">返回可复核结果</text>
<text x="1090.0" y="621" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">保留范围、行数、单位与精度</text>
<text x="1090.0" y="649" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">引用原表单元格及输入版本</text>
<text x="1090.0" y="710" fill="#a78bfa" font-size="16" font-weight="400" text-anchor="start">不在 Chat / RCA 默认链</text>
</g>
<text x="1068.0" y="511" fill="#758ba3" font-size="16" font-weight="400" text-anchor="start">返回与核验</text>
<g data-node="3-main">
<rect x="1570.0" y="248" width="406.0" height="202" rx="6" fill="#302719" stroke="#fbbf24" stroke-width="1.4"/>
<text x="1592.0" y="287" fill="#f1f5f9" font-size="25" font-weight="600" text-anchor="start">查询共享历史指标</text>
<text x="1592.0" y="329" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">经 TAP Insights API 验证授权</text>
<text x="1592.0" y="357" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">按统一口径查询 ClickHouse</text>
<text x="1592.0" y="428" fill="#fbbf24" font-size="16" font-weight="400" text-anchor="start">页面与 AI 共用指标 API</text>
</g>
<g data-node="3-detail">
<rect x="1570.0" y="540" width="406.0" height="192" rx="6" fill="#101d2e" stroke="#35465d" stroke-width="1"/>
<text x="1592.0" y="579" fill="#f1f5f9" font-size="23" font-weight="600" text-anchor="start">返回事实与查询编号</text>
<text x="1592.0" y="621" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">附样本、截至时间及运行证据</text>
<text x="1592.0" y="649" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">接口不可用则关闭指标能力</text>
<text x="1592.0" y="710" fill="#fbbf24" font-size="16" font-weight="400" text-anchor="start">核心知识问答仍可继续</text>
</g>
<text x="1570.0" y="511" fill="#758ba3" font-size="16" font-weight="400" text-anchor="start">返回与核验</text>
<rect x="40.0" y="812" width="4" height="66" rx="2" fill="#39536b" stroke="none" stroke-width="1"/>
<text x="60.0" y="837" fill="#a6b5c9" font-size="18" font-weight="400" text-anchor="start">模型与图不得直连数据库，也不执行任意 SQL 或 Python。</text>
<rect x="693.3333333333334" y="812" width="4" height="66" rx="2" fill="#39536b" stroke="none" stroke-width="1"/>
<text x="713.3333333333334" y="837" fill="#a6b5c9" font-size="18" font-weight="400" text-anchor="start">三条路径按问题选择或组合；chDB 不替代知识检索与 Insights。</text>
<rect x="1346.6666666666667" y="812" width="4" height="66" rx="2" fill="#39536b" stroke="none" stroke-width="1"/>
<text x="1366.6666666666667" y="837" fill="#a6b5c9" font-size="18" font-weight="400" text-anchor="start">当前运行状态由所属业务服务回答，不能依赖历史分析副本。</text>
<text x="40" y="919" fill="#72869d" font-size="16" font-weight="400" text-anchor="start">TAP / TAP AI  ·  RFC-011  ·  目标设计，包含待建设能力</text>
<text x="2000" y="919" fill="#72869d" font-size="16" font-weight="400" text-anchor="end">Cocoon  ·  2026-09-22</text>
