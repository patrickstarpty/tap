<text x="685.0" y="804.06" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">核对并返回有据可查的回答</text>
<text x="685.0" y="835.06" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">数字来自计算，模型负责解释</text>
<text x="685.0" y="866.06" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">再次检查权限、有效期与撤回</text>
<rect x="960.0" y="760.0" width="370.0" height="145.0" fill="white" stroke="#444" stroke-width="1.5"/>
<text x="1145.0" y="804.06" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">保存计算与来源证据</text>
<text x="1145.0" y="835.06" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">输入版本 / 筛选 / 单位 / 行数</text>
<text x="1145.0" y="866.06" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">显示缺数据、歧义与超限</text>
