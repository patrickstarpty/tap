<text x="1145.0" y="443.56" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">chDB 隔离分析任务</text>
<text x="1145.0" y="474.56" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">只读获准文件与结果快照</text>
