<text x="925.0" y="971.0" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="20" fill="#444">文件与快照用 chDB；共享历史查 ClickHouse；需要对照时才联合查询，临时分析不自动发布为知识</text>
