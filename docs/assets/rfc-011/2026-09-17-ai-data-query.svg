<text x="1605.0" y="175.06" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">服务端项目权限、只读及限额</text>
<text x="1605.0" y="206.06" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">ClickHouse 平台历史指标</text>
