<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1030" viewBox="0 0 1840 1030" role="img" aria-labelledby="diagram-title"><title id="diagram-title">TAP AI · 平台架构总览</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#737080"/></marker><marker id="backarrow" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M8 0 L0 4 L8 8 Z" fill="#737080"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="42" y="59.6" font-size="32" font-weight="600" fill="#303447" text-anchor="start"><tspan x="42" dy="0">TAP AI · 平台架构总览</tspan></text><text x="44" y="98.1" font-size="17" font-weight="400" fill="#657085" text-anchor="start"><tspan x="44" dy="0">目标架构 · 从用户请求与业务变化，到有依据的答案、测试方案和受控行动</tspan></text><text x="1794" y="53.1" font-size="17" font-weight="600" fill="#657085" text-anchor="end"><tspan x="1794" dy="0">TAP AI  /  OVERVIEW</tspan></text><path d="M42 122 H1798" stroke="#D9DCE3"/><text x="64" y="187.6" font-size="22" font-weight="600" fill="#303447" text-anchor="start"><tspan x="64" dy="0">核心主链路</tspan></text><text x="64" y="238.7" font-size="19" font-weight="600" fill="#657085" text-anchor="start"><tspan x="64" dy="0">01</tspan></text><path d="M390,390.0 L526,390.0" fill="none" stroke="#737080" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M852,390.0 L988,390.0" fill="none" stroke="#737080" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1314,390.0 L1450,390.0" fill="none" stroke="#737080" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="64" y="265" width="326" height="250" fill="#FFF3CC" stroke="#C8AF68" stroke-width="1.25"/><text x="88" y="358.0" font-size="24" font-weight="600" fill="#303447">任务入口</text><text x="88" y="406.0" font-size="20" fill="#596375">用户对话 / 测试管理</text><text x="88" y="436.0" font-size="20" fill="#596375">需求 / 构建 / 运行事件</text><text x="526" y="238.7" font-size="19" font-weight="600" fill="#657085" text-anchor="start"><tspan x="526" dy="0">02</tspan></text><rect x="526" y="265" width="326" height="250" fill="#EDE5F7" stroke="#9983B7" stroke-width="1.25"/><text x="550" y="328.0" font-size="24" font-weight="600" fill="#303447">统一 AI 编排</text><text x="550" y="376.0" font-size="20" fill="#596375">LangGraph</text><text x="550" y="406.0" font-size="20" fill="#596375">Fast Chat</text><text x="550" y="436.0" font-size="20" fill="#596375">Durable Workflow</text><text x="550" y="466.0" font-size="20" fill="#596375">Bounded Agentic Task</text><text x="988" y="238.7" font-size="19" font-weight="600" fill="#657085" text-anchor="start"><tspan x="988" dy="0">03</tspan></text><rect x="988" y="265" width="326" height="250" fill="#EDE5F7" stroke="#9983B7" stroke-width="1.25"/><text x="1012" y="343.0" font-size="24" font-weight="600" fill="#303447">知识与测试智能</text><text x="1012" y="391.0" font-size="20" fill="#596375">知识问答 / 测试设计</text><text x="1012" y="421.0" font-size="20" fill="#596375">变更影响 / 回归建议</text><text x="1012" y="451.0" font-size="20" fill="#596375">失败分析 / 覆盖风险</text><text x="1450" y="238.7" font-size="19" font-weight="600" fill="#657085" text-anchor="start"><tspan x="1450" dy="0">04</tspan></text><rect x="1450" y="265" width="326" height="250" fill="#E8F3ED" stroke="#8AAC9A" stroke-width="1.25"/><text x="1474" y="343.0" font-size="24" font-weight="600" fill="#303447">结果与受控行动</text><text x="1474" y="391.0" font-size="20" fill="#596375">答案 / 草稿 / 行动提案</text><text x="1474" y="421.0" font-size="20" fill="#596375">批准后调用 TAP 领域 API</text><text x="1474" y="451.0" font-size="20" fill="#596375">执行结果与证据回流</text><text x="64" y="626.6" font-size="22" font-weight="600" fill="#303447" text-anchor="start"><tspan x="64" dy="0">共享支撑</tspan></text><text x="64" y="664.7" font-size="19" font-weight="400" fill="#657085" text-anchor="start"><tspan x="64" dy="0">为整条主链路提供能力，图中省略逐项依赖连线。</tspan></text><rect x="64" y="710" width="526" height="184" fill="#E4F0FA" stroke="#83A7C2" stroke-width="1.25"/><text x="88" y="770.0" font-size="24" font-weight="600" fill="#303447">模型访问</text><text x="88" y="818.0" font-size="20" fill="#596375">ModelGateway → LiteLLM</text><text x="88" y="848.0" font-size="20" fill="#596375">模型策略 / 预算 / 用量审计</text><rect x="656" y="710" width="526" height="184" fill="#E4F0FA" stroke="#83A7C2" stroke-width="1.25"/><text x="680" y="770.0" font-size="24" font-weight="600" fill="#303447">知识与指标</text><text x="680" y="818.0" font-size="20" fill="#596375">SearchPort → Milvus / MySQL Graph</text><text x="680" y="848.0" font-size="20" fill="#596375">Insights API → ClickHouse</text><rect x="1248" y="710" width="526" height="184" fill="#E4F0FA" stroke="#83A7C2" stroke-width="1.25"/><text x="1272" y="770.0" font-size="24" font-weight="600" fill="#303447">状态与任务恢复</text><text x="1272" y="818.0" font-size="20" fill="#596375">MySQL / Outbox：权威状态与事件</text><text x="1272" y="848.0" font-size="20" fill="#596375">Redis / Worker：唤醒与恢复</text><text x="64" y="970.4" font-size="18" font-weight="400" fill="#657085" text-anchor="start"><tspan x="64" dy="0">主动 Agent 复用同一编排入口。正式测试由 TAP 执行；对象存储、Agent/Skill 包与可选文件分析见专题设计。</tspan></text></g></svg>