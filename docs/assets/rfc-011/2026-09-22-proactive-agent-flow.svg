<rect x="566.0" y="248" width="406.0" height="202" rx="6" fill="#0d2c29" stroke="#34d399" stroke-width="1.4"/>
<text x="588.0" y="287" fill="#f1f5f9" font-size="25" font-weight="600" text-anchor="start">形成可审阅方案</text>
<text x="588.0" y="329" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">检索获准证据与项目记忆</text>
<text x="588.0" y="357" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">分析影响、回归范围与失败</text>
<text x="588.0" y="385" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">给出修改草稿、差异和成本</text>
</g>
<g data-node="1-detail">
<rect x="566.0" y="540" width="406.0" height="192" rx="6" fill="#101d2e" stroke="#35465d" stroke-width="1"/>
<text x="588.0" y="579" fill="#f1f5f9" font-size="23" font-weight="600" text-anchor="start">建议进入收件箱</text>
<text x="588.0" y="621" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">展示触发原因、证据与影响</text>
<text x="588.0" y="649" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">默认只分析和生成待审草稿</text>
<text x="588.0" y="710" fill="#34d399" font-size="16" font-weight="400" text-anchor="start">固定 Agent / Skill 与图版本</text>
</g>
<text x="566.0" y="511" fill="#758ba3" font-size="16" font-weight="400" text-anchor="start">输出与控制</text>
<g data-node="2-main">
<rect x="1068.0" y="248" width="406.0" height="202" rx="6" fill="#302719" stroke="#fbbf24" stroke-width="1.4"/>
<text x="1090.0" y="287" fill="#f1f5f9" font-size="25" font-weight="600" text-anchor="start">明确批准本次行动</text>
<text x="1090.0" y="329" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">接受、调整、延后或忽略</text>
<text x="1090.0" y="357" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">核对资源、环境与执行预算</text>
<text x="1090.0" y="385" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">批准绑定方案版本与有效期</text>
</g>
<g data-node="2-detail">
<rect x="1068.0" y="540" width="406.0" height="192" rx="6" fill="#101d2e" stroke="#35465d" stroke-width="1"/>
<text x="1090.0" y="579" fill="#f1f5f9" font-size="23" font-weight="600" text-anchor="start">动作前再次校验</text>
<text x="1090.0" y="621" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">内容变化或撤权使批准失效</text>
<text x="1090.0" y="649" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">副作用须重新确认项目权限</text>
<text x="1090.0" y="710" fill="#fbbf24" font-size="16" font-weight="400" text-anchor="start">订阅启用不等于动作授权</text>
</g>
<text x="1068.0" y="511" fill="#758ba3" font-size="16" font-weight="400" text-anchor="start">输出与控制</text>
<g data-node="3-main">
<rect x="1570.0" y="248" width="406.0" height="202" rx="6" fill="#211e39" stroke="#a78bfa" stroke-width="1.4"/>
<text x="1592.0" y="287" fill="#f1f5f9" font-size="25" font-weight="600" text-anchor="start">执行获准动作</text>
<text x="1592.0" y="329" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">经领域 API 应用修订或建 Run</text>
<text x="1592.0" y="357" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">返回状态、证据与实际费用</text>
<text x="1592.0" y="385" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">反馈用于后续建议质量评估</text>
</g>
<g data-node="3-detail">
<rect x="1570.0" y="540" width="406.0" height="192" rx="6" fill="#101d2e" stroke="#35465d" stroke-width="1"/>
<text x="1592.0" y="579" fill="#f1f5f9" font-size="23" font-weight="600" text-anchor="start">结果与异常可追踪</text>
<text x="1592.0" y="621" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">重复请求不重复执行</text>
<text x="1592.0" y="649" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">结果未知先对账，再决定重试</text>
<text x="1592.0" y="710" fill="#a78bfa" font-size="16" font-weight="400" text-anchor="start">暂停订阅、取消任务、停止 Run 分开</text>
</g>
<text x="1570.0" y="511" fill="#758ba3" font-size="16" font-weight="400" text-anchor="start">输出与控制</text>
