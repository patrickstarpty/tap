<text x="86.0" y="329" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">需求或知识版本更新</text>
<text x="86.0" y="357" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">构建、部署或真实 Run 完成</text>
<text x="86.0" y="385" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">按获准范围定时检查</text>
</g>
<g data-node="0-detail">
<rect x="64.0" y="540" width="406.0" height="192" rx="6" fill="#101d2e" stroke="#35465d" stroke-width="1"/>
<text x="86.0" y="579" fill="#f1f5f9" font-size="23" font-weight="600" text-anchor="start">先控制触发噪声</text>
<text x="86.0" y="621" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">来源校验、去重、合并与冷却</text>
<text x="86.0" y="649" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">订阅可暂停，通知频率可配置</text>
<text x="86.0" y="710" fill="#22d3ee" font-size="16" font-weight="400" text-anchor="start">不监听个人桌面与私人消息</text>
</g>
<text x="64.0" y="511" fill="#758ba3" font-size="16" font-weight="400" text-anchor="start">输出与控制</text>
