<svg xmlns="http://www.w3.org/2000/svg" width="1850" height="830" viewBox="0 0 1850 830" role="img"><title>知识切片人工审核</title><rect width="100%" height="100%" fill="white"/>
<polyline points="410,165 500,165" fill="none" stroke="#555" stroke-width="1.5"/>
<polygon points="500.00,165.00 491.00,169.35 491.00,160.65" fill="#555"/>
<polyline points="870,165 960,165" fill="none" stroke="#555" stroke-width="1.5"/>
<polygon points="960.00,165.00 951.00,169.35 951.00,160.65" fill="#555"/>
<polyline points="1330,165 1420,165" fill="none" stroke="#555" stroke-width="1.5"/>
<polygon points="1420.00,165.00 1411.00,169.35 1411.00,160.65" fill="#555"/>
<polyline points="1070,230 1070,290 800,290 800,365" fill="none" stroke="#555" stroke-width="1.5"/>
<polygon points="800.00,365.00 795.65,356.00 804.35,356.00" fill="#555"/>
<polyline points="685,365 685,230" fill="none" stroke="#555" stroke-width="1.5"/>
<polygon points="685.00,230.00 689.35,239.00 680.65,239.00" fill="#555"/>
<polyline points="1605,230 1605,365" fill="none" stroke="#555" stroke-width="1.5"/>
<polygon points="1605.00,365.00 1600.65,356.00 1609.35,356.00" fill="#555"/>
<polyline points="1420,430 1330,430" fill="none" stroke="#555" stroke-width="1.5"/>
<polygon points="1330.00,430.00 1339.00,425.65 1339.00,434.35" fill="#555"/>
<polyline points="1145,495 1145,630" fill="none" stroke="#555" stroke-width="1.5"/>
<polygon points="1145.00,630.00 1140.65,621.00 1149.35,621.00" fill="#555"/>
<polyline points="960,695 870,695" fill="none" stroke="#555" stroke-width="1.5"/>
<polygon points="870.00,695.00 879.00,690.65 879.00,699.35" fill="#555"/>
<polyline points="685,630 685,495" fill="none" stroke="#555" stroke-width="1.5"/>
<polygon points="685.00,495.00 689.35,504.00 680.65,504.00" fill="#555"/>
<rect x="40" y="100" width="370" height="130" fill="white" stroke="#444" stroke-width="1.5"/>
<text x="225.0" y="136.56" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">解析草稿与原件</text>
<text x="225.0" y="167.56" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">完整条款 / 表格规则 / 流程分支</text>
<text x="225.0" y="198.56" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">来源位置、条件、例外不拆散</text>
<rect x="500" y="100" width="370" height="130" fill="white" stroke="#444" stroke-width="1.5"/>
<text x="685.0" y="136.56" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">业务人员核对与标注</text>
<text x="685.0" y="167.56" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">修正文字、数值、单位、关系</text>
<text x="685.0" y="198.56" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">疑点未解决不能提交批准</text>
<rect x="960" y="100" width="370" height="130" fill="white" stroke="#444" stroke-width="1.5"/>
<text x="1145.0" y="136.56" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">独立复核当前版本</text>
<text x="1145.0" y="167.56" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">复核人与本版编校人员分离</text>
<text x="1145.0" y="198.56" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">批准绑定内容、来源与适用范围</text>
<rect x="1420" y="100" width="370" height="130" fill="white" stroke="#444" stroke-width="1.5"/>
<text x="1605.0" y="136.56" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">冻结批准清单并建立索引</text>
<text x="1605.0" y="167.56" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">文字 / 图像 / 关系全部就绪</text>
<text x="1605.0" y="198.56" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">未完成时不切换正式版本</text>
<rect x="500" y="365" width="370" height="130" fill="white" stroke="#444" stroke-width="1.5"/>
<text x="685.0" y="401.56" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">退回或变更后重新核对</text>
<text x="685.0" y="432.56" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">修改记录与差异保留</text>
<text x="685.0" y="463.56" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">条件、公式与关系依赖一起复核</text>
<rect x="960" y="365" width="370" height="130" fill="white" stroke="#444" stroke-width="1.5"/>
<text x="1145.0" y="401.56" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">正式检索与再次核验</text>
<text x="1145.0" y="432.56" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">仅取已发布、有效、有权的切片</text>
<text x="1145.0" y="463.56" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">补上下文、图表查询同样检查</text>
<rect x="1420" y="365" width="370" height="130" fill="white" stroke="#444" stroke-width="1.5"/>
<text x="1605.0" y="401.56" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">发布当前有效版本</text>
<text x="1605.0" y="432.56" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">MySQL 发布清单控制可见范围</text>
<text x="1605.0" y="463.56" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">撤回立即停用并清缓存</text>
<rect x="500" y="630" width="370" height="130" fill="white" stroke="#444" stroke-width="1.5"/>
<text x="685.0" y="666.56" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">记录采纳与纠错</text>
<text x="685.0" y="697.56" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">原样采纳 / 修改后采纳 / 拒绝</text>
<text x="685.0" y="728.56" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">纠错进入草稿，不自动变成知识</text>
<rect x="960" y="630" width="370" height="130" fill="white" stroke="#444" stroke-width="1.5"/>
<text x="1145.0" y="666.56" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">回答 / 用例 / 自动化检查条件</text>
<text x="1145.0" y="697.56" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">保留批准切片版本和原文证据</text>
<text x="1145.0" y="728.56" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="21" fill="#222">交付前再查撤回与失效</text>
<text x="920.0" y="50" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="20" fill="#444">严格审核模式：沿用 Tapper 工具区的知识库，不增加独立产品入口</text>
<text x="912.5" y="278" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="20" fill="#444">退回 / 资料变更</text>
<text x="915.0" y="808" text-anchor="middle" font-family="STHeiti, sans-serif" font-size="20" fill="#444">普通模式与严格模式分别标识；部分批准用裁剪/遮罩图；人工审批是质量控制，不代表绝对无误。</text>
</svg>