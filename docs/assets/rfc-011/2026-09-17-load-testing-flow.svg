<text x="609.0" y="181" fill="#eef3fa" font-size="24" font-weight="600" text-anchor="start">调试与发布</text>
<text x="566.0" y="214" fill="#92a5bb" font-size="17" font-weight="400" text-anchor="start">性能 QA / 评审人</text>
</g>
<g data-domain="domain-2">
<rect x="1044.0" y="140" width="454.0" height="624" rx="10" fill="#0a1424" stroke="#2a3b50" stroke-width="1"/>
<rect x="1044.0" y="140" width="4" height="624" rx="2" fill="#fbbf24" stroke="none" stroke-width="1"/>
<text x="1068.0" y="181" fill="#fbbf24" font-size="18" font-weight="600" text-anchor="start">03</text>
<text x="1111.0" y="181" fill="#eef3fa" font-size="24" font-weight="600" text-anchor="start">专用资源执行</text>
<text x="1068.0" y="214" fill="#92a5bb" font-size="17" font-weight="400" text-anchor="start">Jenkins / 专用执行池</text>
</g>
<g data-domain="domain-3">
<rect x="1546.0" y="140" width="454.0" height="624" rx="10" fill="#0a1424" stroke="#2a3b50" stroke-width="1"/>
<rect x="1546.0" y="140" width="4" height="624" rx="2" fill="#34d399" stroke="none" stroke-width="1"/>
<text x="1570.0" y="181" fill="#34d399" font-size="18" font-weight="600" text-anchor="start">04</text>
<text x="1613.0" y="181" fill="#eef3fa" font-size="24" font-weight="600" text-anchor="start">收齐与分析</text>
<text x="1570.0" y="214" fill="#92a5bb" font-size="17" font-weight="400" text-anchor="start">Insights / 性能 QA</text>
</g>
<path data-edge="0-main--1-main" d="M470.0,349.0 L566.0,349.0" fill="none" stroke="#8398af" stroke-width="2" marker-end="url(#arrow)"/>
<text x="518.0" y="324.0" fill="#a7b7ca" font-size="15" font-weight="400" text-anchor="middle">确认要求</text>
<path data-edge="1-main--2-main" d="M972.0,349.0 L1068.0,349.0" fill="none" stroke="#8398af" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1020.0" y="324.0" fill="#a7b7ca" font-size="15" font-weight="400" text-anchor="middle">固定版本</text>
<path data-edge="2-main--3-main" d="M1474.0,349.0 L1570.0,349.0" fill="none" stroke="#8398af" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1522.0" y="304.0" fill="#a7b7ca" font-size="15" font-weight="400" text-anchor="middle">批次指标与</text>
<text x="1522.0" y="324.0" fill="#a7b7ca" font-size="15" font-weight="400" text-anchor="middle">证据</text>
<g data-node="0-main">
<rect x="64.0" y="248" width="406.0" height="202" rx="6" fill="#0b2535" stroke="#22d3ee" stroke-width="1.4"/>
<text x="86.0" y="287" fill="#f1f5f9" font-size="25" font-weight="600" text-anchor="start">明确性能要求</text>
<text x="86.0" y="329" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">确认业务量、延迟及错误上限</text>
<text x="86.0" y="357" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">创建请求、变量、断言和数据</text>
</g>
<g data-node="0-detail">
<rect x="64.0" y="540" width="406.0" height="192" rx="6" fill="#101d2e" stroke="#35465d" stroke-width="1"/>
<text x="86.0" y="579" fill="#f1f5f9" font-size="23" font-weight="600" text-anchor="start">明确负载语义</text>
<text x="86.0" y="621" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">区分并发用户与迭代到达率</text>
<text x="86.0" y="649" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">目标环境、时段与预算获准</text>
<text x="86.0" y="710" fill="#22d3ee" font-size="16" font-weight="400" text-anchor="start">AI 不自行编造并发数</text>
</g>
<text x="64.0" y="511" fill="#758ba3" font-size="16" font-weight="400" text-anchor="start">输出与控制</text>
<g data-node="1-main">
<rect x="566.0" y="248" width="406.0" height="202" rx="6" fill="#211e39" stroke="#a78bfa" stroke-width="1.4"/>
<text x="588.0" y="287" fill="#f1f5f9" font-size="25" font-weight="600" text-anchor="start">低负载调试后评审</text>
<text x="588.0" y="329" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">核对动态参数、数据隔离及断言</text>
<text x="588.0" y="357" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">固定脚本、镜像、门槛与测量窗</text>
</g>
<g data-node="1-detail">
<rect x="566.0" y="540" width="406.0" height="192" rx="6" fill="#101d2e" stroke="#35465d" stroke-width="1"/>
<text x="588.0" y="579" fill="#f1f5f9" font-size="23" font-weight="600" text-anchor="start">冻结运行清单</text>
<text x="588.0" y="621" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">记录场景版本、分片与资源上限</text>
<text x="588.0" y="649" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">确认目标权限及停止规则</text>
<text x="588.0" y="710" fill="#a78bfa" font-size="16" font-weight="400" text-anchor="start">调试成功不代表容量达标</text>
</g>
<text x="566.0" y="511" fill="#758ba3" font-size="16" font-weight="400" text-anchor="start">输出与控制</text>
<g data-node="2-main">
<rect x="1068.0" y="248" width="406.0" height="202" rx="6" fill="#302719" stroke="#fbbf24" stroke-width="1.4"/>
<text x="1090.0" y="287" fill="#f1f5f9" font-size="25" font-weight="600" text-anchor="start">发压并监控实际负载</text>
<text x="1090.0" y="329" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">k6 接口负载，Playwright 浏览器</text>
<text x="1090.0" y="357" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">记录实际速率、错误与机器健康</text>
</g>
<g data-node="2-detail">
<rect x="1068.0" y="540" width="406.0" height="192" rx="6" fill="#101d2e" stroke="#35465d" stroke-width="1"/>
<text x="1090.0" y="579" fill="#f1f5f9" font-size="23" font-weight="600" text-anchor="start">停止由节点落实</text>
<text x="1090.0" y="621" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">停止新迭代，限时收尾后退出</text>
<text x="1090.0" y="649" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">超预算、失联与租约到期均停</text>
<text x="1090.0" y="710" fill="#fbbf24" font-size="16" font-weight="400" text-anchor="start">取消 Jenkins 不等于已停压</text>
</g>
<text x="1068.0" y="511" fill="#758ba3" font-size="16" font-weight="400" text-anchor="start">输出与控制</text>
<g data-node="3-main">
<rect x="1570.0" y="248" width="406.0" height="202" rx="6" fill="#0d2c29" stroke="#34d399" stroke-width="1.4"/>
<text x="1592.0" y="287" fill="#f1f5f9" font-size="25" font-weight="600" text-anchor="start">计算全局性能结论</text>
<text x="1592.0" y="329" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">核对分片、批次及完成标记</text>
<text x="1592.0" y="357" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">统计全局分位数并比较可比基线</text>
</g>
<g data-node="3-detail">
<rect x="1570.0" y="540" width="406.0" height="192" rx="6" fill="#101d2e" stroke="#35465d" stroke-width="1"/>
<text x="1592.0" y="579" fill="#f1f5f9" font-size="23" font-weight="600" text-anchor="start">分别报告三项结果</text>
<text x="1592.0" y="621" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">运行状态、性能结论、数据完整性</text>
<text x="1592.0" y="649" fill="#c4cede" font-size="19" font-weight="400" text-anchor="start">负载不足或缺数据不能通过</text>
<text x="1592.0" y="710" fill="#34d399" font-size="16" font-weight="400" text-anchor="start">超时封账为不完整报告</text>
</g>
<text x="1570.0" y="511" fill="#758ba3" font-size="16" font-weight="400" text-anchor="start">输出与控制</text>
<rect x="40.0" y="812" width="4" height="66" rx="2" fill="#39536b" stroke="none" stroke-width="1"/>
<text x="60.0" y="837" fill="#a6b5c9" font-size="18" font-weight="400" text-anchor="start">先交付 k6 单机闭环；分布式、私网和浏览器负载逐项验收。</text>
<rect x="693.3333333333334" y="812" width="4" height="66" rx="2" fill="#39536b" stroke="none" stroke-width="1"/>
<text x="713.3333333333334" y="837" fill="#a6b5c9" font-size="18" font-weight="400" text-anchor="start">功能测试与负载测试资源隔离；协议与浏览器指标分别计算。</text>
<rect x="1346.6666666666667" y="812" width="4" height="66" rx="2" fill="#39536b" stroke="none" stroke-width="1"/>
<text x="1366.6666666666667" y="837" fill="#a6b5c9" font-size="18" font-weight="400" text-anchor="start">不能平均各节点 p95；AI 不得降低已批准性能门槛。</text>
<text x="40" y="919" fill="#72869d" font-size="16" font-weight="400" text-anchor="start">TAP / TAP AI  ·  RFC-011  ·  目标设计，包含待建设能力</text>
<text x="2000" y="919" fill="#72869d" font-size="16" font-weight="400" text-anchor="end">Cocoon  ·  2026-09-22</text>
</svg>