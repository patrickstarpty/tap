<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2040 940" role="img" aria-label="负载测试设计、执行与判定"><style>text{font-family:"JetBrains Mono","PingFang SC","Microsoft YaHei",monospace}</style><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7" fill="#8398af"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#162338" stroke-width=".5"/></pattern></defs><rect width="2040" height="940" fill="#060e1d"/><rect width="2040" height="940" fill="url(#grid)"/>
<text x="40" y="49" fill="#f1f5f9" font-size="31" font-weight="600" text-anchor="start">负载测试设计、执行与判定</text>
<text x="40" y="89" fill="#91a3b9" font-size="20" font-weight="400" text-anchor="start">新增目标 · 先确认业务量与门槛，再以专用资源验证实际承载</text>
