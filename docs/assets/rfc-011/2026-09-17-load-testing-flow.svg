<text x="107.0" y="181" fill="#eef3fa" font-size="24" font-weight="600" text-anchor="start">要求与场景</text>
<text x="64.0" y="214" fill="#92a5bb" font-size="17" font-weight="400" text-anchor="start">业务负责人 / 性能 QA</text>
</g>
