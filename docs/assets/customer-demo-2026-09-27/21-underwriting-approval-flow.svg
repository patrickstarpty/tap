<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-label="Synthetic underwriting approval flowchart with three roles, three decisions, and two retry loops">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ad5719"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#25302e} .title{font-size:29px;font-weight:700}.sub{font-size:15px;fill:#66716e}.lane{font-size:17px;font-weight:700;fill:#596562}.node{fill:#fff;stroke:#adb8b4;stroke-width:2}.decision{fill:#fff8f1;stroke:#c8722f;stroke-width:2}.label{font-size:19px;font-weight:600;text-anchor:middle}.small{font-size:15px;fill:#66716e;text-anchor:middle}.edge{fill:none;stroke:#ad5719;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.edge-label{font-size:15px;font-weight:700;fill:#ad5719}.lane-line{stroke:#dce2df;stroke-width:2;stroke-dasharray:8 8}
    </style>
  </defs>
  <rect width="1500" height="900" fill="#fbfaf8"/>
  <rect x="0" y="92" width="1500" height="185" fill="#f7f8f6"/>
  <rect x="0" y="277" width="1500" height="270" fill="#fff"/>
  <rect x="0" y="547" width="1500" height="353" fill="#f7f8f6"/>
  <text x="48" y="45" class="title">Underwriting approval: disclosure to policy issuance</text>
  <text x="48" y="73" class="sub">Synthetic example · review node text, arrow direction, branch conditions and return paths before publication</text>
  <text x="28" y="125" class="lane">Applicant</text><text x="28" y="310" class="lane">Operations</text><text x="28" y="580" class="lane">Underwriting / Compliance</text>
  <path d="M0 277H1500M0 547H1500" class="lane-line"/>

  <rect class="node" x="90" y="166" width="205" height="72" rx="13"/><text class="label" x="192" y="209">Submit application</text>
  <rect class="node" x="436" y="166" width="185" height="72" rx="13"/><text class="label" x="528" y="197">Complete missing</text><text class="label" x="528" y="220">disclosure</text>
  <rect class="node" x="1092" y="166" width="170" height="72" rx="13"/><text class="label" x="1177" y="197">Retry failed</text><text class="label" x="1177" y="220">payment</text>
  <rect class="node" x="1320" y="166" width="155" height="72" rx="13"/><text class="label" x="1397" y="197">Receive</text><text class="label" x="1397" y="220">policy</text>

  <rect class="node" x="110" y="370" width="165" height="72" rx="13"/><text class="label" x="192" y="401">Validate</text><text class="label" x="192" y="424">application</text>
  <path class="decision" d="M440 355 540 406 440 457 340 406Z"/><text class="label" x="440" y="398">Disclosure</text><text class="label" x="440" y="421">complete?</text>
  <rect class="node" x="850" y="370" width="165" height="72" rx="13"/><text class="label" x="932" y="401">Prepare</text><text class="label" x="932" y="424">quote</text>
  <path class="decision" d="M1165 355 1265 406 1165 457 1065 406Z"/><text class="label" x="1165" y="398">Payment</text><text class="label" x="1165" y="421">confirmed?</text>
  <rect class="node" x="1320" y="370" width="155" height="72" rx="13"/><text class="label" x="1397" y="401">Issue</text><text class="label" x="1397" y="424">policy</text>

  <rect class="node" x="590" y="640" width="165" height="72" rx="13"/><text class="label" x="672" y="671">Assess</text><text class="label" x="672" y="694">risk</text>
  <path class="decision" d="M905 627 1000 676 905 725 810 676Z"/><text class="label" x="905" y="668">High</text><text class="label" x="905" y="691">risk?</text>
  <rect class="node" x="1060" y="600" width="175" height="72" rx="13"/><text class="label" x="1147" y="631">Senior</text><text class="label" x="1147" y="654">review</text>
  <rect class="node" x="1280" y="600" width="170" height="72" rx="13"/><text class="label" x="1365" y="631">Compliance</text><text class="label" x="1365" y="654">approval</text>
  <rect class="node" x="1030" y="775" width="205" height="72" rx="13"/><text class="label" x="1132" y="806">Automatic</text><text class="label" x="1132" y="829">approval</text>

  <path class="edge" d="M192 238V370"/>
  <path class="edge" d="M275 406H340"/>
  <path class="edge" d="M440 355V270H528V238"/><text class="edge-label" x="453" y="326">No · request correction</text>
  <path class="edge" d="M436 202H322V340H192V370"/><text class="edge-label" x="300" y="286">Resubmit</text>
  <path class="edge" d="M440 457V676H590"/><text class="edge-label" x="453" y="499">Yes</text>
  <path class="edge" d="M755 676H810"/>
  <path class="edge" d="M1000 676H1060"/><text class="edge-label" x="1009" y="660">Yes</text>
  <path class="edge" d="M1235 636H1280"/>
  <path class="edge" d="M1365 600V520H932V442"/><text class="edge-label" x="1110" y="508">Approved</text>
  <path class="edge" d="M905 725V811H1030"/><text class="edge-label" x="930" y="758">No</text>
  <path class="edge" d="M1132 775V748H800V520H870V442"/>
  <path class="edge" d="M1015 406H1065"/>
  <path class="edge" d="M1165 355V238"/><text class="edge-label" x="1180" y="290">No · retry</text>
  <path class="edge" d="M1262 202H1300V326H1165V355"/>
  <path class="edge" d="M1265 406H1320"/><text class="edge-label" x="1275" y="390">Yes</text>
  <path class="edge" d="M1397 370V238"/>
  <text x="48" y="877" class="sub">Review checkpoint: unconfirmed connections must stay outside published knowledge.</text>
</svg>
