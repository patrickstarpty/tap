name: contracts

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4.6
        env:
          MYSQL_DATABASE: tap
          MYSQL_PASSWORD: tap
          MYSQL_ROOT_PASSWORD: tap-root
          MYSQL_USER: tap
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -utap -ptap --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          version: "0.10.8"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.0"
      - run: corepack enable
      - run: make bootstrap
      - run: make contracts
      - run: |
          git diff --exit-code -- contracts/openapi/api.json contracts/events/chat-stream.schema.json &&
          test -z "$(git ls-files --others --exclude-standard -- contracts/openapi/api.json contracts/events/chat-stream.schema.json)"
      - run: make check
      - run: uv run --project apps/backend alembic -c apps/backend/alembic.ini upgrade head
      - run: make test
