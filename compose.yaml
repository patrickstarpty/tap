services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4.6}
    restart: unless-stopped
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tap-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tap}
      MYSQL_USER: ${MYSQL_USER:-tap}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tap}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: ${REDIS_IMAGE:-redis:7.4.7}
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  azurite:
    image: ${AZURITE_IMAGE:-mcr.microsoft.com/azure-storage/azurite:3.35.0}
    restart: unless-stopped
    command:
      - azurite-blob
      - --blobHost
      - 0.0.0.0
      - --blobPort
      - "10000"
      - --location
      - /data
      - --debug
      - /data/debug.log
    ports:
      - "127.0.0.1:${AZURITE_BLOB_PORT:-10000}:10000"
    volumes:
      - azurite-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const http = require("http");
          const req = http.get(
            "http://127.0.0.1:10000/devstoreaccount1?comp=list&maxresults=1",
            (res) => process.exit(/azurite-blob/i.test(String(res.headers.server || "")) ? 0 : 1),
          );
          req.on("error", () => process.exit(1));
          req.on("timeout", () => {
            req.destroy();
            process.exit(1);
          });
          req.setTimeout(5000);
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 10s

  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:main-v1.76.1-stable}
    restart: unless-stopped
    command:
      - --config
      - /app/config.yaml
      - --host
      - 0.0.0.0
      - --port
      - "4000"
      - --num_workers
      - "1"
      - --telemetry
      - "False"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-tap-local-master-key}
      LITELLM_MODEL: ${LITELLM_MODEL:-openai/gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./deploy/local/litellm/config.yaml:/app/config.yaml:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys
          import urllib.request
          try:
              with urllib.request.urlopen("http://127.0.0.1:4000/health/liveliness", timeout=5) as response:
                  sys.exit(0 if response.status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s

  milvus-etcd:
    profiles: [milvus]
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd --advertise-client-urls=http://127.0.0.1:2379 --listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    volumes: [milvus-etcd-data:/etcd]

  milvus-minio:
    profiles: [milvus]
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ROOT_USER: ${MILVUS_MINIO_ROOT_USER:-tap-local-minio}
      MINIO_ROOT_PASSWORD: ${MILVUS_MINIO_ROOT_PASSWORD:-tap-local-minio-password}
    command: minio server /minio_data
    volumes: [milvus-minio-data:/minio_data]

  milvus:
    profiles: [milvus]
    image: milvusdb/milvus:v2.6.22
    command: [milvus, run, standalone]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MQ_TYPE: woodpecker
    depends_on: [milvus-etcd, milvus-minio]
    ports:
      - "127.0.0.1:${MILVUS_PORT:-19530}:19530"
      - "127.0.0.1:${MILVUS_HEALTH_PORT:-9091}:9091"
    volumes:
      - milvus-data:/var/lib/milvus
      - ./deploy/local/milvus/milvus.yaml:/milvus/configs/milvus.yaml:ro
    healthcheck:
      test: [CMD, curl, -f, http://127.0.0.1:9091/healthz]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mysql-data:
  redis-data:
  azurite-data:
  milvus-etcd-data:
  milvus-minio-data:
  milvus-data:
